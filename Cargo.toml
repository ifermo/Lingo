[workspace]
resolver = "3"
members = [
    "crates/lingo-core",
    "crates/lingo-net",
    "crates/lingo-ui",
    "crates/lingo-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# UI
slint = "1.18.1"
slint-build = "1.18.1"

# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["pkcs8", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
pkcs8 = { version = "0.10", features = ["pem"] }
rusqlite = { version = "0.41", features = ["bundled"] }
quinn = "0.11"
rustls = "0.23"
rcgen = "0.14"
sha2 = "0.10"
mdns-sd = "0.11"
dirs = "6"
walkdir = "2"

# App
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "net",
    "io-util",
    "signal",
] }
flume = "0.11"
rfd = "0.15"
clipboard-files = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }

# Dev
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
